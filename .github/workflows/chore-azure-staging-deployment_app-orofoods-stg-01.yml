# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-orofoods-stg-01

on:
  push:
    branches:
      - chore/azure-staging-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Orofoods.slnx --configuration Release

      - name: dotnet publish
        run: dotnet publish Orofoods.Web/Orofoods.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Validate web publish artifact
        run: |
          set -euo pipefail

          publish_dir="./publish"
          test -f "$publish_dir/Orofoods.Web.dll"
          test -f "$publish_dir/Orofoods.Web.deps.json"
          test -f "$publish_dir/Orofoods.Web.runtimeconfig.json"
          test -d "$publish_dir/wwwroot"

          if find "$publish_dir" -type f \( -name 'Orofoods.Web.Tests.dll' -o -name 'Orofoods.Web.Tests.runtimeconfig.json' \) -print -quit | grep -q .; then
            echo "::error::Test project artifacts found in the web publish package."
            exit 1
          fi

          runtimeconfig_count="$(find "$publish_dir" -type f -name '*.runtimeconfig.json' | wc -l)"
          if [ "$runtimeconfig_count" -ne 1 ]; then
            echo "::error::Expected exactly one runtimeconfig.json, found $runtimeconfig_count."
            find "$publish_dir" -type f -name '*.runtimeconfig.json' -print
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C51235A1EE0C4B548C8B7B6305A2E923 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C166783DBF8545468F2A630102809C12 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_69BA164183EA4E9FBB4F27B3B51031C6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-orofoods-stg-01'
          slot-name: 'Production'
          package: ./publish
