name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - docs/**
      - chore/**
      - hotfix/**

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Orofoods.slnx
      - name: Build
        run: dotnet build Orofoods.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Orofoods.Web.Tests/Orofoods.Web.Tests.csproj --no-restore --configuration Release